name: Cadence
options:
  bundleIdPrefix: app.cadence
  deploymentTarget: { iOS: "17.0" }
packages:
  CadenceCore: { path: Packages/CadenceCore }
targets:
  Cadence:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies: [{ package: CadenceCore }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cadence.Cadence
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Cadence listens while you speak to score your pronunciation."
