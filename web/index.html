<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B10">
<title>Cadence · Web Prototype</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Cadence</h1><span id="cap" class="pill"></span></header>
<main>
  <section id="practice" class="tab active">
    <div class="cats" id="cats"></div>
    <p id="ref" class="ref" aria-live="polite"></p>
    <div class="orbwrap"><canvas id="orb" width="520" height="520" aria-hidden="true"></canvas><div id="ring" class="ringtxt" aria-live="polite"></div></div>
    <div class="row">
      <button id="rec" class="primary">Hold to speak</button>
      <button id="next">Next sentence</button>
    </div>
    <p id="status" class="muted"></p>
    <details id="typed"><summary>No microphone or speech recognition? Type what you said</summary>
      <form id="typedform"><input id="typedinput" placeholder="What you said…" autocomplete="off"><button>Score</button></form>
    </details>
    <div id="result" hidden>
      <div class="scores" id="scores"></div>
      <div class="words" id="words"></div>
      <p class="muted">Tap a word to hear it.</p>
    </div>
  </section>
  <section id="history" class="tab"><h2>History</h2><canvas id="chart" width="600" height="200"></canvas><ul id="hlist" class="list"></ul></section>
  <section id="bank" class="tab"><h2>Word Bank</h2><ul id="blist" class="list"></ul></section>
  <section id="league" class="tab"><h2>This week</h2><p class="big" id="xp">0 XP</p><p class="muted">Streak: <span id="streak">0</span> days. Leaderboard needs the backend (M2+).</p></section>
</main>
<nav>
  <button data-tab="practice" class="on">Practice</button>
  <button data-tab="history">History</button>
  <button data-tab="bank">Word Bank</button>
  <button data-tab="league">Week</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
